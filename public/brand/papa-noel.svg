<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 270" role="img" aria-label="Papá Noel empujando el carrito de Mercado Origen">
<style>
.bob{animation:bob .5s ease-in-out infinite alternate}
.legA{transform-box:fill-box;transform-origin:50% 0;animation:walk .5s ease-in-out infinite alternate}
.legB{transform-box:fill-box;transform-origin:50% 0;animation:walk .5s ease-in-out infinite alternate-reverse}
.spin{transform-box:fill-box;transform-origin:center;animation:spin .7s linear infinite}
.pom{transform-box:fill-box;transform-origin:100% 0;animation:pom .5s ease-in-out infinite alternate}
.road{animation:road .7s linear infinite}
.snow circle{animation:fall 4s linear infinite}
.snow circle:nth-child(2n){animation-duration:5.5s}
.snow circle:nth-child(3n){animation-duration:3.4s}
@keyframes bob{to{transform:translateY(-3px)}}
@keyframes walk{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pom{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
@keyframes road{to{transform:translateX(-40px)}}
@keyframes fall{from{transform:translateY(-30px);opacity:0}15%{opacity:1}to{transform:translateY(270px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g class="snow" fill="#cfe3d6">
<circle cx="30" cy="0" r="3.5" style="animation-delay:-1s"/><circle cx="85" cy="0" r="2.5" style="animation-delay:-2.6s"/>
<circle cx="150" cy="0" r="3" style="animation-delay:-.4s"/><circle cx="235" cy="0" r="2.5" style="animation-delay:-3.1s"/>
<circle cx="300" cy="0" r="3.5" style="animation-delay:-1.8s"/><circle cx="365" cy="0" r="2.5" style="animation-delay:-.9s"/>
<circle cx="400" cy="0" r="3" style="animation-delay:-2.2s"/>
</g>
<g class="road" stroke="#d9cdb5" stroke-width="4" stroke-linecap="round">
<path d="M0 250h22M40 250h22M80 250h22M120 250h22M160 250h22M200 250h22M240 250h22M280 250h22M320 250h22M360 250h22M400 250h22M440 250h22"/>
</g>
<ellipse cx="210" cy="246" rx="175" ry="5" fill="#000" opacity=".07"/>

