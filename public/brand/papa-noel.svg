    <g class="spin"><path fill="#fcc005" d="M292.54,418.52c-1.02-17.08-11.63-31.72-27.83-37.71-15.78-5.83-34.84-.68-45.55,12.27-11.25,13.6-13.41,33.2-4.12,48.53,9.26,15.29,27.1,22.74,44.51,19.37,18.78-3.64,31.82-20.56,32.98-39.11.06-.55.09-1.11.08-1.7C292.62,419.59,292.59,419.05,292.54,418.52ZM250.86,437.91c-9.86,0-17.75-7.99-17.75-17.74s7.95-17.77,17.75-17.75c10.01.02,17.52,7.96,17.75,17.75C268.38,429.89,260.89,437.91,250.86,437.91Z"/><path d="M249 392v52M223 418h52" stroke="#fcc005" stroke-width="7" stroke-linecap="round"/></g>
